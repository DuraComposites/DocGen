<template>
    <!-- Modified by Dura Composites Ltd. -->
    <div class="app-container">
        <!-- Refined Professional Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <img src={logoUrl} alt="DocGen" class="logo-icon" />
                <div class="logo-text">
                    <h2>DocGen</h2>
                    <p>Document Automation</p>
                </div>
            </div>

            <div class="nav-links">
                <button class={templatesTabClass} onclick={handleShowTemplates}>
                    <lightning-icon icon-name="utility:file" size="x-small" class="nav-icon"></lightning-icon>
                    <span>My Templates</span>
                </button>
                <button class={bulkTabClass} onclick={handleShowBulk}>
                    <lightning-icon icon-name="utility:layers" size="x-small" class="nav-icon"></lightning-icon>
                    <span>Bulk Generation</span>
                </button>
                <button class={signaturesTabClass} onclick={handleShowSignatures}>
                    <lightning-icon icon-name="utility:edit_form" size="x-small" class="nav-icon"></lightning-icon>
                    <span>Signatures</span>
                </button>
                <button class={assetsTabClass} onclick={handleShowAssets}>
                    <lightning-icon icon-name="utility:image" size="x-small" class="nav-icon"></lightning-icon>
                    <span>Assets</span>
                </button>
                <template if:true={showButtonsTab}>
                    <button class={buttonsTabClass} onclick={handleShowButtons}>
                        <lightning-icon
                            icon-name="utility:button_choice"
                            size="x-small"
                            class="nav-icon"
                        ></lightning-icon>
                        <span>Buttons</span>
                    </button>
                    <button class={sendEmailTabClass} onclick={handleShowSendEmail}>
                        <lightning-icon icon-name="utility:send" size="x-small" class="nav-icon"></lightning-icon>
                        <span>Send Email</span>
                    </button>
                </template>
                <button class={emailTabClass} onclick={handleShowEmail}>
                    <lightning-icon icon-name="utility:email" size="x-small" class="nav-icon"></lightning-icon>
                    <span>Email Templates</span>
                </button>
                <button class={brandsTabClass} onclick={handleShowBrands}>
                    <lightning-icon icon-name="utility:apps" size="x-small" class="nav-icon"></lightning-icon>
                    <span>Brands</span>
                </button>
                <button class={helpTabClass} onclick={handleShowHelp}>
                    <lightning-icon icon-name="utility:knowledge_base" size="x-small" class="nav-icon"></lightning-icon>
                    <span>Learning Center</span>
                </button>
            </div>

            <div class="sidebar-footer">
                <div class="footer-note">Problems or ideas? Tell your Salesforce administrator.</div>
            </div>
        </nav>

        <!-- Main Workspace Area -->
        <main class="workspace">
            <!-- Dynamic Content Area -->
            <div class="content-panel">
                <template if:true={isLoaded}>
                    <!-- TEMPLATES -->
                    <template if:true={isTemplates}>
                        <div class="panel-header">
                            <h2>Template Library</h2>
                            <p>Manage your document designs and create new ones.</p>
                        </div>
                        <div class="panel-body">
                            <c-doc-gen-admin onmanagebrands={handleShowBrands}></c-doc-gen-admin>
                        </div>
                    </template>

                    <!-- BULK -->
                    <template if:true={isBulk}>
                        <div class="panel-header">
                            <h2>Bulk Generation</h2>
                            <p>Create documents for hundreds of records at the same time.</p>
                        </div>
                        <div class="panel-body">
                            <c-doc-gen-bulk-runner></c-doc-gen-bulk-runner>
                        </div>
                    </template>

                    <!-- SIGNATURES -->
                    <template if:true={isSignatures}>
                        <div class="panel-header">
                            <h2>Signature Settings</h2>
                            <p>Configure email branding, site URL, and signature behavior.</p>
                        </div>
                        <div class="panel-body">
                            <c-doc-gen-signature-settings></c-doc-gen-signature-settings>
                        </div>
                    </template>

                    <!-- ASSETS -->
                    <template if:true={isAssets}>
                        <div class="panel-header">
                            <h2>Shared Assets</h2>
                            <p>
                                Manage reusable images, Terms and HTML snippets, and approved custom fonts in one place.
                            </p>
                        </div>
                        <div class="panel-body">
                            <c-doc-gen-assets></c-doc-gen-assets>
                        </div>
                    </template>

                    <!-- BUTTONS -->
                    <template if:true={showButtonsSection}>
                        <div class="panel-header">
                            <h2>Document Buttons</h2>
                            <p>
                                Create one-click document buttons for record pages — choose the object, template, and
                                record types, no Setup needed.
                            </p>
                        </div>
                        <div class="panel-body">
                            <c-doc-gen-button-builder></c-doc-gen-button-builder>
                        </div>
                    </template>

                    <!-- SEND EMAIL BUTTONS -->
                    <template if:true={showSendEmailSection}>
                        <div class="panel-header">
                            <div>
                                <h2>Send Email Buttons</h2>
                                <p>
                                    Create record-page Send Email actions that generate a document, attach it to the
                                    source record, and email it to selected or manually entered recipients.
                                </p>
                            </div>
                        </div>
                        <div class="panel-body">
                            <c-doc-gen-button-builder action-type="Email"></c-doc-gen-button-builder>
                        </div>
                    </template>

                    <!-- EMAIL TEMPLATES -->
                    <template if:true={isEmail}>
                        <div class="panel-header">
                            <h2>Email Templates</h2>
                            <p>
                                Brand and edit every signature email — request, reminder, verification, and completion.
                            </p>
                        </div>
                        <div class="panel-body">
                            <c-doc-gen-email-templates onmanagebrands={handleShowBrands}></c-doc-gen-email-templates>
                        </div>
                    </template>

                    <!-- BRANDS -->
                    <template if:true={isBrands}>
                        <div class="panel-header">
                            <h2>Brands</h2>
                            <p>
                                Set up a reusable sender identity — address, logo, and color — for each business unit,
                                then choose it on any DocGen Template.
                            </p>
                        </div>
                        <div class="panel-body">
                            <c-doc-gen-brands></c-doc-gen-brands>
                        </div>
                    </template>

                    <!-- HELP / LEARNING CENTER — links to the User Guide on GitHub -->
                    <template if:true={isHelp}>
                        <div class="panel-header">
                            <h2>User Guide</h2>
                            <p>The full DocGen User Guide is on GitHub, with the source.</p>
                        </div>
                        <div class="panel-body">
                            <div class="guide-redirect-card">
                                <h3>Open the DocGen User Guide</h3>
                                <p>
                                    Setup walkthroughs, merge-tag syntax, e-signature configuration, PDF features, Flow
                                    integration, troubleshooting — everything is in the guide.
                                </p>
                                <a
                                    href="https://github.com/DuraComposites/DocGen/blob/main/UserGuide.md"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="guide-redirect-button"
                                >
                                    Open the User Guide ↗
                                </a>
                                <p class="guide-redirect-fineprint">
                                    Need help or training? Ask your Salesforce administrator.
                                </p>
                            </div>
                        </div>
                    </template>
                </template>
            </div>
        </main>
    </div>
</template>
