<!-- Dura Composites Ltd. (new file) -->
<template>
    <lightning-card title={cardTitle} icon-name="standard:contract">
        <lightning-button-icon
            slot="actions"
            icon-name="utility:refresh"
            alternative-text="Refresh"
            title="Refresh"
            onclick={handleRefresh}
        ></lightning-button-icon>

        <div class="body">
            <template lwc:if={loading}>
                <div class="spinner-holder">
                    <lightning-spinner alternative-text="Loading signature requests" size="small"></lightning-spinner>
                </div>
            </template>
            <template lwc:if={error}>
                <p class="slds-text-color_error">{error}</p>
            </template>
            <template lwc:if={isEmpty}>
                <p class="muted">No signature requests yet.</p>
            </template>

            <template for:each={groups} for:item="g">
                <section key={g.key} class="group">
                    <template lwc:if={g.showHeader}>
                        <a class="group-heading" data-id={g.recordId} onclick={handleOpenRecord}>{g.heading}</a>
                    </template>

                    <template for:each={g.requests} for:item="r">
                        <article key={r.key} class="request">
                            <div class="request-head">
                                <a class="title" data-id={r.id} onclick={handleOpenRecord}>{r.title}</a>
                                <span class={r.pillClass}>{r.statusLabel}</span>
                            </div>
                            <p class="muted small">{r.signerNames} · {r.summary}</p>
                            <template lwc:if={r.hasPlan}>
                                <p class="muted small plan">
                                    <span>{r.plan}</span>
                                    <template lwc:if={r.canChange}>
                                        <button class="link" data-id={r.id} onclick={handleStartExtend}>
                                            {r.extendLabel}
                                        </button>
                                        <button class="link" data-id={r.id} onclick={handleStartReminders}>
                                            Reminders
                                        </button>
                                    </template>
                                </p>
                            </template>

                            <template lwc:if={r.isEditingExpiry}>
                                <div class="editor">
                                    <lightning-input
                                        type="date"
                                        label="Link expires on"
                                        value={editExpiresOn}
                                        min={todayIso}
                                        max={maxDateIso}
                                        onchange={handleEditExpiresOn}
                                    ></lightning-input>
                                    <p class="muted small">
                                        Signers can use their link until the end of this day. The change goes on the
                                        timeline with your name.
                                    </p>
                                    <div class="editor-actions">
                                        <lightning-button label="Cancel" onclick={handleCancelEdit}></lightning-button>
                                        <lightning-button
                                            variant="brand"
                                            label="Save"
                                            data-id={r.id}
                                            disabled={saving}
                                            onclick={handleSaveExpiry}
                                        ></lightning-button>
                                    </div>
                                </div>
                            </template>

                            <template lwc:if={r.isEditingReminders}>
                                <div class="editor">
                                    <lightning-combobox
                                        label="Reminders"
                                        options={reminderModeOptions}
                                        value={editMode}
                                        onchange={handleEditMode}
                                    ></lightning-combobox>
                                    <template lwc:if={editIsEvery}>
                                        <div class="editor-row">
                                            <lightning-input
                                                type="number"
                                                label="Every (days)"
                                                min="1"
                                                max="365"
                                                value={editEvery}
                                                onchange={handleEditEvery}
                                            ></lightning-input>
                                            <lightning-input
                                                type="date"
                                                label="Until (optional)"
                                                min={todayIso}
                                                value={editUntil}
                                                field-level-help="Leave blank to keep reminding until the link expires."
                                                onchange={handleEditUntil}
                                            ></lightning-input>
                                        </div>
                                    </template>
                                    <div class="editor-actions">
                                        <lightning-button label="Cancel" onclick={handleCancelEdit}></lightning-button>
                                        <lightning-button
                                            variant="brand"
                                            label="Save"
                                            data-id={r.id}
                                            disabled={saving}
                                            onclick={handleSaveReminders}
                                        ></lightning-button>
                                    </div>
                                </div>
                            </template>

                            <button class="toggle" data-id={r.id} onclick={handleToggle} aria-expanded={r.expanded}>
                                <lightning-icon icon-name={r.toggleIcon} size="xx-small"></lightning-icon>
                                <span>{r.toggleLabel}</span>
                            </button>

                            <template lwc:if={r.expanded}>
                                <ol class="timeline">
                                    <template for:each={r.items} for:item="t">
                                        <li key={t.key} class="event">
                                            <span class={t.dotClass}></span>
                                            <template lwc:if={t.hasTime}>
                                                <lightning-formatted-date-time
                                                    class="when"
                                                    value={t.at}
                                                    weekday="short"
                                                    day="numeric"
                                                    month="short"
                                                    hour="2-digit"
                                                    minute="2-digit"
                                                ></lightning-formatted-date-time>
                                            </template>
                                            <span class={t.textClass}>{t.text}</span>
                                        </li>
                                    </template>
                                </ol>
                                <template lwc:if={r.hasDrawings}>
                                    <template for:each={r.drawingLines} for:item="line">
                                        <p key={line} class="small drawing">
                                            <lightning-icon icon-name="utility:file" size="xx-small"></lightning-icon>
                                            <span>{line}</span>
                                        </p>
                                    </template>
                                </template>
                                <template lwc:if={r.hasSignedFile}>
                                    <lightning-button
                                        label="Signed PDF"
                                        icon-name="doctype:pdf"
                                        variant="base"
                                        data-id={r.signedFileId}
                                        onclick={handleOpenSignedFile}
                                    ></lightning-button>
                                </template>
                            </template>
                        </article>
                    </template>
                </section>
            </template>
        </div>
    </lightning-card>
</template>
